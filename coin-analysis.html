<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幣種深度分析 · 比特聯盟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17120B;--bg-deep:#100C06;--panel:#211A10;--panel-hi:#2A2114;
  --line:rgba(243,233,216,.09);--amber:#FFB020;--amber-soft:#FFD24A;
  --up:#3FD07F;--down:#FF5F56;--warn:#FFD24A;--text:#F3E9D8;--dim:#B7A488;--mute:#85765C;
  --mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'Noto Sans TC',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg-deep);color:var(--text);font-family:var(--sans)}
body{max-width:460px;margin:0 auto;padding:14px 14px 40px;position:relative;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0,rgba(0,0,0,.16) 1px,transparent 1px,transparent 3px);
  mix-blend-mode:multiply;opacity:.5}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.back{font-family:var(--mono);font-size:12px;color:var(--amber);text-decoration:none}
.title{font-size:14px;font-weight:700}
.clock{font-family:var(--mono);font-size:11px;color:var(--mute)}
/* 幣種切換 */
.coins{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.coin{flex:0 0 auto;font-family:var(--mono);font-size:12px;padding:6px 12px;border-radius:20px;
  border:1px solid var(--line);color:var(--dim);background:var(--panel);cursor:pointer}
.coin.on{color:#1a1206;background:var(--amber);border-color:var(--amber);font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:10px}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.hd .name{font-size:13px;font-weight:700;color:var(--text);display:flex;gap:7px;align-items:center}
.hd .name i{color:var(--amber);font-style:normal}
.badge{font-size:10.5px;padding:2px 8px;border-radius:20px;font-family:var(--mono);color:var(--amber);background:rgba(255,176,32,.14)}
/* 評分 hero */
.hero{background:radial-gradient(120% 140% at 100% 0%,rgba(255,176,32,.13),transparent 60%),var(--panel-hi);
  border:1px solid rgba(255,176,32,.22)}
.hero .r{display:flex;align-items:flex-end;justify-content:space-between}
.hero .px{font-family:var(--mono);font-size:22px;font-weight:600}
.hero .px small{font-size:12px;color:var(--mute);font-weight:400}
.hero .sc{text-align:right}
.hero .sc b{font-family:var(--mono);font-size:30px;font-weight:600}
.hero .sc span{display:block;font-size:12px;font-weight:700}
.bd{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:7px 12px}
.bd .row{display:flex;align-items:center;gap:8px}
.bd .k{font-size:11px;color:var(--dim);width:34px}
.bd .tr{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.06);position:relative;overflow:hidden}
.bd .fl{position:absolute;top:0;bottom:0;border-radius:3px}
.bd .v{font-family:var(--mono);font-size:11px;width:34px;text-align:right}
.advice{font-size:13px;line-height:1.55;color:var(--amber-soft)}
.advice .mut{color:var(--dim);font-size:12px}
/* 隧道尺標 */
.tgrp{margin-bottom:12px}
.tgrp:last-child{margin-bottom:0}
.tgrp .lab{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}
.tgrp .lab b{font-weight:700}
.tgrp .st{font-family:var(--mono);font-size:11px}
.gauge{position:relative;height:34px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.band{position:absolute;top:0;bottom:0}
.band.large{background:rgba(255,176,32,.06)}
.band.big{background:rgba(255,176,32,.11)}
.band.small{background:rgba(255,176,32,.20)}
.needle{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);box-shadow:0 0 6px rgba(243,233,216,.6)}
.needle::after{content:"";position:absolute;top:-4px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--text)}
.needle.up{background:var(--up)}.needle.up::after{background:var(--up)}
.needle.down{background:var(--down)}.needle.down::after{background:var(--down)}
.gscale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--mute);margin-top:3px}
/* 技術面表 */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.mini{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px;text-align:center}
.mini .ml{font-size:10px;color:var(--mute);font-family:var(--mono)}
.mini .mv{font-size:13px;font-weight:700;margin-top:2px}
.mv.up{color:var(--up)}.mv.down{color:var(--down)}.mv.mid{color:var(--warn)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{color:var(--mute);font-weight:500;font-size:11px;text-align:right;padding:4px 6px;font-family:var(--mono)}
.tbl th:first-child{text-align:left}
.tbl td{text-align:right;padding:5px 6px;font-family:var(--mono);border-top:1px solid var(--line)}
.tbl td:first-child{text-align:left;color:var(--dim);font-family:var(--sans)}
.u{color:var(--up)}.d{color:var(--down)}.w{color:var(--warn)}
/* 訊號組成 checklist */
.cond{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cond .side b{font-size:12px;display:block;margin-bottom:5px}
.ck{font-size:11.5px;padding:2px 0;color:var(--mute);font-family:var(--mono)}
.ck.on{color:var(--text)}
.ck .mk{display:inline-block;width:14px;color:var(--mute)}
.ck.on .mk{color:var(--amber)}
.empty{font-size:12px;color:var(--mute);font-family:var(--mono)}
.foot{text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:16px;line-height:1.7}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
</style>
</head>
<body>
<h1 class="sr-only">幣種深度分析</h1>
<header class="top">
  <a class="back" href="home.html">‹ 作戰室</a>
  <span class="title">幣種深度分析</span>
  <span class="clock" id="clock">--:--</span>
</header>
<div class="coins" id="coins"></div>

<section class="card hero">
  <div class="r">
    <div><div class="px" id="px">$--</div><div class="hd" style="margin:0"><span class="badge" id="fund">資金 —</span></div></div>
    <div class="sc"><b id="score">—</b><span id="dir" style="color:var(--warn)">讀取中</span></div>
  </div>
  <div class="bd" id="bd"></div>
</section>

<section class="card">
  <div class="hd"><div class="name"><i>◈</i> 三貓咪隧道</div><span class="badge">巢狀三層</span></div>
  <div id="tunnels"><div class="empty">讀取隧道…</div></div>
</section>

<section class="card">
  <div class="hd"><div class="name"><i>▤</i> 多時框技術面</div></div>
  <table class="tbl" id="ind"><tbody><tr><td class="empty">讀取中…</td></tr></tbody></table>
</section>

<div class="foot">比特聯盟 · 幣種深度分析 · 資料僅供參考，非投資建議<br>更新於 <span id="stamp">—</span></div>

<script>
const CFG={
  bitoApi:'https://web-production-f4735.up.railway.app',
  analysisPath:'/analysis',
  coins:['BTCUSDT','ETHUSDT','SOLUSDT','DOGEUSDT','BNBUSDT','XRPUSDT'],
  refreshMs:45000,
};
let CUR='BTCUSDT';
const $=id=>document.getElementById(id);
const j=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()};
const fmtUSD=n=>'$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:n<10?4:0});
const short=s=>s.replace('USDT','');

/* 幣種切換 */
function renderCoins(){
  $('coins').innerHTML=CFG.coins.map(c=>`<span class="coin${c===CUR?' on':''}" data-c="${c}">${short(c)}</span>`).join('');
  $('coins').querySelectorAll('.coin').forEach(el=>el.onclick=()=>{CUR=el.dataset.c;renderCoins();load();});
}

function dirColor(d){return /多/.test(d)?'var(--up)':/空/.test(d)?'var(--down)':'var(--warn)';}
function zoneText(cs){return cs==='near_upper'?'貼上緣':cs==='near_lower'?'貼下緣':cs==='short_cross'?'空方穿越':cs==='long_cross'?'多方穿越':'隧道內';}

async function load(){
  try{
    const d=await j(`${CFG.bitoApi}${CFG.analysisPath}?symbol=${CUR}`);
    renderHero(d); renderTunnels(d); renderInd(d);
    $('stamp').textContent=new Date().toLocaleTimeString('zh-TW');
  }catch(e){ $('advice').textContent='/analysis 連不上，確認端點與幣種代碼。'; }
}
function renderHero(d){
  const price=+(d.funding?.markPrice||d.ticker?.last||0);
  $('px').innerHTML=fmtUSD(price)+` <small>${short(CUR)}</small>`;
  const fr=d.funding?+d.funding.fundingRate:null;
  $('fund').textContent='資金 '+(fr==null?'—':(fr>=0?'+':'')+fr.toFixed(3)+'%');
  const sc=d.score||{};
  $('score').textContent=sc.score??'—';
  const dd=$('dir'); dd.textContent=sc.direction||'—'; dd.style.color=dirColor(sc.direction||'');
  const b=sc.breakdown||{};
  const rows=[['趨勢',b.trend],['結構',b.structure],['動能',b.momentum],['波動',b.volatility]];
  $('bd').innerHTML=rows.map(([k,v])=>{
    v=v??0; const pos=v>=0; const w=Math.min(Math.abs(v)/10*100,100);
    const col=pos?'var(--up)':'var(--down)';
    return `<div class="row"><span class="k">${k}</span><span class="tr">
      <span class="fl" style="${pos?'left:50%':'right:50%'};width:${w/2}%;background:${col}"></span></span>
      <span class="v" style="color:${col}">${v>0?'+':''}${v}</span></div>`;
  }).join('');
}
function renderTunnels(d){
  const g=d.groups||[]; const names=['短線 15/30','中線 H1/H2','長線 H4/H8'];
  if(!g.length){$('tunnels').innerHTML='<div class="empty">無隧道資料</div>';return;}
  $('tunnels').innerHTML=g.slice(0,3).map((x,i)=>{
    const t=x.tunnel||{}; const lo=+t.big_dn,hi=+t.big_up; const rng=hi-lo||1;
    const pct=v=>Math.max(0,Math.min(100,(v-lo)/rng*100));
    const p=+t.last_price;
    const dcol=t.direction==='up'?'up':t.direction==='down'?'down':'';
    const stcol=/upper|long/.test(t.cross_state)?'u':/lower|short/.test(t.cross_state)?'d':'w';
    return `<div class="tgrp">
      <div class="lab"><b>${names[i]||x.label}</b>
        <span class="st ${stcol}">${t.direction==='up'?'▲':t.direction==='down'?'▼':'·'} ${zoneText(t.cross_state)} · pos ${(+t.pos).toFixed(2)}</span></div>
      <div class="gauge">
        <span class="band large" style="left:0;right:0"></span>
        <span class="band big" style="left:${pct(+t.b_dn)}%;right:${100-pct(+t.b_up)}%"></span>
        <span class="band small" style="left:${pct(+t.s_dn)}%;right:${100-pct(+t.s_up)}%"></span>
        <span class="needle ${dcol}" style="left:${pct(p)}%"></span>
      </div>
      <div class="gscale"><span>${Math.round(lo).toLocaleString()}</span><span>${Math.round(hi).toLocaleString()}</span></div>
    </div>`;
  }).join('');
}
function renderInd(d){
  const ind=d.indicators||[]; if(!ind.length){$('ind').innerHTML='<tbody><tr><td class="empty">—</td></tr></tbody>';return;}
  const head=`<thead><tr><th>時框</th><th>KDJ</th><th>MACD</th><th>RSI</th></tr></thead>`;
  const body=ind.map(r=>{
    const kdj=r.kdj||{},macd=r.macd||{},rsi=r.rsi||{};
    const kc=kdj.golden_cross?'u':kdj.dead_cross?'d':'';
    const mc=macd.bullish?'u':'d';
    const rc=rsi.overbought?'d':rsi.oversold?'u':'';
    return `<tr><td>${r.label}</td>
      <td class="${kc}">${kdj.k!=null?kdj.k.toFixed(0):'—'}${kdj.golden_cross?' ↗':kdj.dead_cross?' ↘':''}</td>
      <td class="${mc}">${macd.bullish?'多':'空'}</td>
      <td class="${rc}">${rsi.value!=null?rsi.value.toFixed(0):'—'}</td></tr>`;
  }).join('');
  $('ind').innerHTML=head+'<tbody>'+body+'</tbody>';
}
function tick(){const d=new Date(),p=n=>String(n).padStart(2,'0');$('clock').textContent=`${p(d.getHours())}:${p(d.getMinutes())}`;}
renderCoins(); load();
setInterval(tick,1000);tick();
setInterval(load,CFG.refreshMs);
</script>
</body>
</html>
